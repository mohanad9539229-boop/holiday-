<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كل عام وأنتم بخير | الإصدار الشفاف بالكامل</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            /* الخلفية شفافة تماماً لإبراز صورتك بالكامل */
            background: linear-gradient(135deg, rgba(20, 2, 2, 0.3) 0%, rgba(5, 5, 5, 0.4) 100%), 
                        url('https://i.ibb.co/3YTHpML9/IMG-5620.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1500px;
        }

        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #0d0d0d;
            z-index: 999999;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            padding: 20px;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        .audio-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            background: linear-gradient(45deg, #8b0000, #ff3333);
            color: #fff;
            border: 2px solid #ffd700;
            font-size: 1.4rem;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulseGlow 2s infinite;
            z-index: 1000000;
        }

        .audio-btn:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 0 25px #ffd700;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
            50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
            100% { box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }
        }

        .welcome-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .top-ticker {
            position: absolute;
            top: 20px;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            z-index: 10;
            background: rgba(139, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255, 215, 0, 0.15);
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            padding: 12px 0;
        }

        .ticker-content {
            display: inline-block;
            animation: marquee 30s linear infinite;
            font-size: 1.2rem;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            font-weight: bold;
        }

        @keyframes marquee {
            0% { transform: translate3d(50%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .card-container {
            position: relative;
            width: 420px;
            height: 580px;
            z-index: 5;
            transform-style: preserve-3d;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        /* تعديل المربع في النص ليكون شفافاً بالكامل تقريباً مع تأثير زجاجي فخم */
        .main-card {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.03); /* تم جعل الخلفية شفافة جداً */
            border: 2px solid rgba(255, 215, 0, 0.6); /* إطار ذهبي لامع */
            border-radius: 24px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 
                        inset 0 0 20px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px); /* تأثير تمويه الزجاج */
            -webkit-backdrop-filter: blur(8px);
            transform-style: preserve-3d;
        }

        /* إزالة التوهج الخلفي المكثف لكي لا يحجب الصورة خلف المربع */
        .main-card::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, rgba(255,215,0,0.3), rgba(255,51,51,0.2), rgba(255,215,0,0.3));
            border-radius: 24px;
            z-index: -1;
            transform: translateZ(-20px);
            filter: blur(20px);
            opacity: 0.4;
        }

        /* جعل خلفية الشعار الدائري داخل الكرت شفافة أيضاً */
        .card-logo {
            width: 110px;
            height: 110px;
            background: rgba(139, 0, 0, 0.25);
            border: 2px solid #ffd700;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
            transform: translateZ(70px);
            font-size: 2.8rem;
            animation: floatEffect 4s ease-in-out infinite;
            backdrop-filter: blur(5px);
        }

        .card-title {
            font-size: 2.8rem;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7), 0 5px 10px rgba(0,0,0,0.5);
            font-weight: 900;
            transform: translateZ(50px);
        }

        .card-message {
            font-size: 1.4rem;
            line-height: 1.8;
            color: #f0f0f0;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            transform: translateZ(40px);
        }

        .highlight {
            color: #ff3333;
            font-weight: bold;
            display: block;
            font-size: 1.7rem;
            margin-top: 12px;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.8);
        }

        .action-btn {
            background: linear-gradient(90deg, #ffd700, #ffb700);
            color: #000;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
            transform: translateZ(60px);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            box-shadow: 0 0 30px #ff3333;
            transform: translateZ(80px) scale(1.05);
        }

        @keyframes floatEffect {
            0%, 100% { transform: translateZ(70px) translateY(0); }
            50% { transform: translateZ(70px) translateY(-10px); }
        }

        @media (max-width: 480px) {
            body { perspective: 1000px; }
            .card-container { width: 90vw; height: 530px; }
            .card-title { font-size: 2.2rem; }
            .card-message { font-size: 1.1rem; }
            .highlight { font-size: 1.4rem; }
            .audio-btn { width: 45px; height: 45px; font-size: 1.1rem; top: 15px; right: 15px; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="https://cropgif.net/audio/1779918156083-1048536a-b3de-400d-9287-07db12773343.mp3" loop></audio>

    <div class="welcome-overlay" id="welcomeOverlay">
        <button class="audio-btn" onclick="startWebsite()" title="تشغيل الصوت">🌙🎵</button>
    </div>

    <div class="top-ticker">
        <div class="ticker-content">
            ✦ تهنئة خاصة بمناسبة العيد السعيد ✦ كل عام وأنتم بخير وصحة وسلامة ✦ عساكم من عواده ✦ تقبل الله منا ومنكم صالح الأعمال ✦ كل عام وأنتم إلى الله أقرب ✦
        </div>
    </div>

    <div class="particles" id="particles"></div>

    <div class="card-container" id="cardContainer">
        <div class="main-card">
            <div class="card-logo">🌙</div>
            <h1 class="card-title">كل عام وأنت بخير</h1>
            <p class="card-message">
                بمناسبة الحلول المبارك والجميل، نتمنى لك خطى مليئة بالنجاح والتوفيق.
                <span class="highlight">أيامك مجيدة وسعيدة!</span>
            </p>
            <button class="action-btn" onclick="celebrate()">اضغط للفخامة ✦</button>
        </div>
    </div>

    <script>
        const cardContainer = document.getElementById('cardContainer');
        const particlesContainer = document.getElementById('particles');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const bgMusic = document.getElementById('bgMusic');

        function startWebsite() {
            bgMusic.play().catch(err => {
                console.log("المتصفح منع التشغيل تلقائياً: ", err);
            });
            welcomeOverlay.classList.add('fade-out');
        }

        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth < 768) return; 
            const xAxis = (window.innerWidth / 2 - e.pageX) / 20;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 20;
            cardContainer.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            cardContainer.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        function createParticles() {
            const count = window.innerWidth < 600 ? 25 : 60;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                const size = Math.random() * 5 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.background = Math.random() > 0.4 ? '#ffd700' : '#ff3333';
                particle.style.borderRadius = '50%';
                particle.style.top = Math.random() * 100 + 'vh';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.opacity = Math.random() * 0.6 + 0.2;
                particle.style.boxShadow = `0 0 ${size * 2}px ${particle.style.background}`;
                
                particlesContainer.appendChild(particle);
                animateParticle(particle);
            }
        }

        function animateParticle(p) {
            let speed = Math.random() * 1 + 0.5;
            let topPos = parseFloat(p.style.top);
            
            function move() {
                topPos -= speed;
                if (topPos < -10) {
                    topPos = 105;
                    p.style.left = Math.random() * 100 + 'vw';
                }
                p.style.top = topPos + 'vh';
                requestAnimationFrame(move);
            }
            move();
        }

        createParticles();

        function celebrate() {
            for (let i = 0; i < 60; i++) {
                const spark = document.createElement('div');
                spark.style.position = 'absolute';
                spark.style.width = Math.random() * 6 + 4 + 'px';
                spark.style.height = spark.style.width;
                const colors = ['#ffd700', '#ff3333', '#ffffff', '#ffb700'];
                spark.style.background = colors[Math.floor(Math.random() * colors.length)];
                spark.style.borderRadius = '50%';
                spark.style.top = '50%';
                spark.style.left = '50%';
                spark.style.boxShadow = `0 0 15px ${spark.style.background}`;
                spark.style.zIndex = '100';
                
                document.body.appendChild(spark);
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 12 + 6;
                let x = 0;
                let y = 0;
                let opacity = 1;

                function launch() {
                    x += Math.cos(angle) * velocity;
                    y += Math.sin(angle) * velocity;
                    y += 0.2; 
                    opacity -= 0.015;
                    
                    spark.style.transform = `translate(${x}px, ${y}px)`;
                    spark.style.opacity = opacity;
                    if (opacity > 0) {
                        requestAnimationFrame(launch);
                    } else {
                        spark.remove();
                    }
                }
                launch();
            }
        }
    </script>
</body>
</html>
