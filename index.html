<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كل عام وأنتم بخير | تهنئة أسطورية</title>
    <style>
        /* إعدادات الخلفية العامة والفخامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* وضع رابط الصورة الخاصة بك كخلفية للموقع */
            background: linear-gradient(rgba(10, 0, 0, 0.6), rgba(10, 0, 0, 0.85)), url('https://ibb.co/1J0xrdwt') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* شاشة الدخول السوداء الفخمة */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease, transform 1s ease;
        }

        .welcome-text {
            color: #ffffff;
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
        }

        .audio-btn {
            background: linear-gradient(90deg, #ffd700, #ffb700);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
        }

        .audio-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px #ffd700;
        }

        /* جزيئات الخلفية المتحركة */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* حاوية النص المتحرك العلوية */
        .top-ticker {
            position: absolute;
            top: 20px;
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            z-index: 10;
            background: rgba(139, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding: 10px 0;
        }

        .ticker-content {
            display: inline-block;
            padding-right: 100%;
            animation: marquee 25s linear infinite;
            font-size: 1.2rem;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-weight: bold;
            letter-spacing: 2px;
        }

        @keyframes marquee {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* الكرت الأسطوري ثلاثي الأبعاد 3D */
        .card-container {
            position: relative;
            width: 400px;
            height: 550px;
            z-index: 5;
            transition: transform 0.1s ease;
            transform-style: preserve-3d;
        }

        .main-card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(20, 0, 0, 0.85) 0%, rgba(5, 5, 5, 0.95) 100%);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 
                        0 0 30px rgba(139, 0, 0, 0.4),
                        inset 0 0 20px rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(10px);
            transform-style: preserve-3d;
            position: relative;
        }

        /* العناصر الداخلية وتأثير خروجها بالـ 3D */
        .card-title {
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6), 0 5px 5px rgba(0,0,0,0.5);
            font-weight: 900;
            transform: translateZ(60px);
            transition: transform 0.3s ease;
            animation: pulse 2s infinite alternate;
        }

        .card-logo {
            width: 100px;
            height: 100px;
            background: radial-gradient(#8b0000, #2a0000);
            border: 2px solid #ffd700;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px #8b0000;
            transform: translateZ(80px);
            font-size: 2.5rem;
        }

        .card-message {
            font-size: 1.5rem;
            line-height: 1.8;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            transform: translateZ(50px);
            font-weight: 300;
        }

        .highlight {
            color: #ff3333;
            font-weight: bold;
            display: block;
            font-size: 1.8rem;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }

        /* زر تفاعلي أسطوري */
        .action-btn {
            background: linear-gradient(90deg, #8b0000, #ff3333);
            color: white;
            border: 1px solid #ffd700;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
            transform: translateZ(70px);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: linear-gradient(90deg, #ff3333, #8b0000);
            box-shadow: 0 0 25px #ffd700;
            transform: translateZ(90px) scale(1.05);
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
            100% { text-shadow: 0 0 25px rgba(255, 215, 0, 0.9), 0 0 10px #ff3333; }
        }

        @media (max-width: 450px) {
            .card-container {
                width: 90vw;
                height: 500px;
            }
            .card-title { font-size: 2rem; }
            .card-message { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="https://cropgif.net/audio/1779918156083-1048536a-b3de-400d-9287-07db12773343.mp3" loop></audio>

    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="welcome-text">اضغط الزر لتشغيل اغنيه الموقع</div>
        <button class="audio-btn" onclick="startWebsite()">تشغيل الصوت</button>
    </div>

    <div class="top-ticker">
        <div class="ticker-content">
            ✦ تهنئة خاصة بمناسبة العيد السعيد ✦ كل عام وأنتم بخير وصحة وسلامة ✦ عساكم من عواده ✦ تقبل الله منا ومنكم صالح الأعمال ✦ كل عام وأنتم إلى الله أقرب ✦
        </div>
    </div>

    <div class="particles" id="particles"></div>

    <div class="card-container" id="cardContainer">
        <div class="main-card">
            <div class="card-logo">🌙</div>
            <h1 class="card-title">كل عام وأنت بخير</h1>
            <p class="card-message">
                بمناسبة الحلول المبارك والجميل، نتمنى لك خطى مليئة بالنجاح والتوفيق.
                <span class="highlight">أيامك مجيدة وسعيدة!</span>
            </p>
            <button class="action-btn" onclick="celebrate()">اضغط للفخامة</button>
        </div>
    </div>

    <script>
        const cardContainer = document.getElementById('cardContainer');
        const particlesContainer = document.getElementById('particles');
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const bgMusic = document.getElementById('bgMusic');

        // دالة تشغيل الموسيقى وإخفاء الشاشة السوداء
        function startWebsite() {
            // تشغيل الصوت بعد تفاعل المستخدم مباشرة لتخطي حظر المتصفح
            bgMusic.play().catch(error => {
                console.log("تعذر تشغيل الصوت تلقائياً:", error);
            });

            // إخفاء الشاشة السوداء بتأثير اختفاء ناعم
            welcomeOverlay.style.opacity = '0';
            welcomeOverlay.style.transform = 'scale(1.1)';
            setTimeout(() => {
                welcomeOverlay.style.display = 'none';
            }, 1000);
        }

        // تأثير الـ 3D التفاعلي عند تحريك الماوس
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 15;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 15;
            cardContainer.style.transform = `rotateY(${xAxis}deg) rotateX(${-yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            cardContainer.style.transform = `rotateY(0deg) rotateX(0deg)`;
            cardContainer.style.transition = "all 0.5s ease";
        });

        cardContainer.addEventListener('mouseenter', () => {
            cardContainer.style.transition = "none";
        });

        // توليد تأثير الجسيمات المضيئة الصاعدة
        function createParticles() {
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = Math.random() * 4 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = Math.random() > 0.5 ? '#ffd700' : '#ff3333';
                particle.style.borderRadius = '50%';
                particle.style.top = Math.random() * 100 + 'vh';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.opacity = Math.random();
                particle.style.boxShadow = `0 0 10px ${particle.style.background}`;
                
                particlesContainer.appendChild(particle);
                animateParticle(particle);
            }
        }

        function animateParticle(p) {
            let speed = Math.random() * 2 + 1;
            let topPos = parseFloat(p.style.top);
            
            function move() {
                topPos -= speed;
                if (topPos < -10) {
                    topPos = 105;
                    p.style.left = Math.random() * 100 + 'vw';
                }
                p.style.top = topPos + 'vh';
                requestAnimationFrame(move);
            }
            move();
        }

        createParticles();

        // حركة الألعاب النارية عند الضغط على زر الفخامة
        function celebrate() {
            for (let i = 0; i < 50; i++) {
                const spark = document.createElement('div');
                spark.style.position = 'absolute';
                spark.style.width = '6px';
                spark.style.height = '6px';
                spark.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
                spark.style.borderRadius = '50%';
                spark.style.top = '50%';
                spark.style.left = '50%';
                spark.style.boxShadow = `0 0 15px ${spark.style.background}`;
                spark.style.zIndex = '100';
                
                document.body.appendChild(spark);

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 15 + 5;
                let x = 0;
                let y = 0;
                let opacity = 1;

                function launch() {
                    x += Math.cos(angle) * velocity;
                    y += Math.sin(angle) * velocity;
                    opacity -= 0.02;
                    
                    spark.style.transform = `translate(${x}px, ${y}px)`;
                    spark.style.opacity = opacity;

                    if (opacity > 0) {
                        requestAnimationFrame(launch);
                    } else {
                        spark.remove();
                    }
                }
                launch();
            }
        }
    </script>
</body>
</html>
